name: Intraday Taiwan SuperTrend AI Signal Scanner & Telegram Notifier (13:10)

on:
  schedule:
    # 台灣時間週一至週五 13:10 (UTC 05:10) 觸發
    # 考量 GitHub Actions 偶發數分鐘排隊延遲，約於 13:10~13:15 執行完畢
    - cron: '10 5 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行測試

concurrency:
  group: intraday-tw-signals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Intraday Taiwan SuperTrend AI Signal Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python run_intraday_tw_signals.py --telegram
