name: Intraday Taiwan SuperTrend AI Signal Scanner & Telegram Notifier (13:10)

on:
  # 已停用 GitHub Actions 內建排程，全面改由外部 cron-job.org 於台灣時間週一至週五 13:10 精準觸發
  # schedule:
  #   - cron: '10 5 * * 1-5'
  workflow_dispatch: # 支援外部 API 與 GitHub 網頁手動觸發

concurrency:
  group: intraday-tw-signals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Intraday Taiwan SuperTrend AI Signal Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python run_intraday_tw_signals.py --telegram
