name: Daily SuperTrend Signal Scanner & Telegram Notifier

on:
  schedule:
    # 1. 週一至週五美股收盤後 (UTC 21:00，對應台北時間隔日早上 05:00)
    #    進行每日歷史數據更新與訊號掃描
    - cron: '0 21 * * 1-5'

    # 2. 固定週六 (UTC 21:00，對應台北時間週日早上 05:00)
    #    觸發全標的重新進行網格參數優化
    - cron: '0 21 * * 6'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行測試

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine if Force Reoptimize is Needed
        id: check_schedule
        run: |
          # 取得目前為星期幾 (6 代表週六)
          DAY_OF_WEEK=$(date +%u)
          if [ "$DAY_OF_WEEK" -eq 6 ]; then
            echo "REOPTIMIZE_FLAG=--force-reoptimize" >> $GITHUB_ENV
            echo "Today is Saturday, enabling force re-optimization."
          else
            echo "REOPTIMIZE_FLAG=" >> $GITHUB_ENV
            echo "Regular weekday run."
          fi

      - name: Run Daily Scanner & Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_daily_scanner.py $REOPTIMIZE_FLAG

      - name: Commit and Push Updated Optimized Parameters
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/optimized_params.json
          git commit -m "auto: update optimized_params.json [skip ci]" || exit 0
          git push

