name: Daily SuperTrend Signal Scanner & Telegram Notifier

on:
  schedule:
    # 1. 美股收盤後 (UTC 00:30，對應台北時間週二至週六早上 08:30，台股開盤前)
    #    避開整點排隊延遲，進行每日歷史數據更新與訊號掃描
    - cron: '30 0 * * 2-6'

    # 2. 固定週末 (UTC 00:30 週日，對應台北時間週日早上 08:30)
    #    觸發全標的重新進行網格參數優化
    - cron: '30 0 * * 0'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行測試

concurrency:
  group: daily-signals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine if Force Reoptimize is Needed
        id: check_schedule
        run: |
          # 優先依據觸發排程的 Cron 表達式判斷是否為週末排程，避免 GitHub Actions 隊列延遲跨日誤判
          CRON_SCHEDULE="${{ github.event.schedule }}"
          DAY_OF_WEEK=$(date +%u)
          if [[ "$CRON_SCHEDULE" == *" 0"* ]] || [[ "$CRON_SCHEDULE" == *" 6"* ]] || ([ -z "$CRON_SCHEDULE" ] && ([ "$DAY_OF_WEEK" -eq 7 ] || [ "$DAY_OF_WEEK" -eq 6 ])); then
            echo "REOPTIMIZE_FLAG=--force-reoptimize" >> $GITHUB_ENV
            echo "Schedule or Day is weekend, enabling force re-optimization."
          else
            echo "REOPTIMIZE_FLAG=" >> $GITHUB_ENV
            echo "Regular weekday run."
          fi

      - name: Run Daily Scanner & Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_daily_scanner.py $REOPTIMIZE_FLAG

      - name: Commit and Push Updated Parameters & Most Active Tickers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/optimized_params.json data/most-active.json
          if ! git diff --staged --quiet; then
            git commit -m "auto: update optimized_params.json and most-active.json [skip ci]"
            # 併發防禦機制：拉取最新遠端 commit 並進行 rebase 重試，避免與其他工作流推送衝突
            pushed=0
            for i in {1..5}; do
              echo "Push attempt $i: Pulling latest changes with rebase..."
              if git pull --rebase --autostash origin "${{ github.ref_name }}" && git push; then
                pushed=1
                echo "Successfully pushed changes to remote!"
                break
              fi
              echo "Push attempt $i failed. Cleaning up rebase state and retrying in 5s..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "Failed to push after multiple attempts."
              exit 1
            fi
          else
            echo "No changes to commit."
          fi
