name: Daily SuperTrend Signal Scanner & Telegram Notifier

on:
  # 已停用 GitHub Actions 內建排程，全面改由外部（如 cron-job.org）透過 API 觸發
  # schedule:
  #   - cron: '30 0 * * 2-6'
  #   - cron: '30 0 * * 0'
  workflow_dispatch:
    inputs:
      force_reoptimize:
        description: '是否強制重新優化全標的參數 (--force-reoptimize)'
        required: false
        type: boolean
        default: false

concurrency:
  group: daily-signals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine if Force Reoptimize is Needed
        id: check_schedule
        run: |
          # 檢查是否手動勾選強制優化，或以台灣時區 (Asia/Taipei) 判斷是否為週末 (6=週六, 7=週日)
          INPUT_FORCE="${{ inputs.force_reoptimize }}"
          TW_DAY=$(TZ="Asia/Taipei" date +%u)
          if [ "$INPUT_FORCE" = "true" ] || [ "$TW_DAY" -eq 6 ] || [ "$TW_DAY" -eq 7 ]; then
            echo "REOPTIMIZE_FLAG=--force-reoptimize" >> $GITHUB_ENV
            echo "台灣時間為週末 (星期 $TW_DAY) 或手動指定，已啟用 --force-reoptimize 重新進行參數優化！"
          else
            echo "REOPTIMIZE_FLAG=" >> $GITHUB_ENV
            echo "台灣時間為平日 (星期 $TW_DAY)，使用既有參數執行每日訊號掃描。"
          fi

      - name: Run Daily Scanner & Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python run_daily_scanner.py $REOPTIMIZE_FLAG

      - name: Commit and Push Updated Parameters & Most Active Tickers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/optimized_params.json data/most-active.json
          if ! git diff --staged --quiet; then
            git commit -m "auto: update optimized_params.json and most-active.json [skip ci]"
            # 併發防禦機制：拉取最新遠端 commit 並進行 rebase 重試，避免與其他工作流推送衝突
            pushed=0
            for i in {1..5}; do
              echo "Push attempt $i: Pulling latest changes with rebase..."
              if git pull --rebase --autostash origin "${{ github.ref_name }}" && git push; then
                pushed=1
                echo "Successfully pushed changes to remote!"
                break
              fi
              echo "Push attempt $i failed. Cleaning up rebase state and retrying in 5s..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "Failed to push after multiple attempts."
              exit 1
            fi
          else
            echo "No changes to commit."
          fi
