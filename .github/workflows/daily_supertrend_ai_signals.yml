name: Daily SuperTrend AI Signal Scanner & Telegram Notifier

on:
  schedule:
    # 1. 週一至週五美股收盤後 2.5 小時 (UTC 23:30，對應台北時間隔日早上 07:30)
    #    避開整點尖峰佇列壅塞，確保 Yahoo Finance 數據完全結算封存
    - cron: '30 23 * * 1-5'

    # 2. 固定週六 (UTC 23:30 週六，對應台北時間週日早上 07:30)
    #    觸發全標的重新進行網格參數優化
    - cron: '30 23 * * 6'
  workflow_dispatch: # 支援在 GitHub 網頁上手動點擊執行測試

concurrency:
  group: daily-supertrend-ai-signals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-and-notify:
    runs-on: ubuntu-latest
    timeout-minutes: 60  # AI 優化可能需要較長時間，將 timeout 延長到 60 分鐘
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine if Force Reoptimize is Needed
        id: check_schedule
        run: |
          # 優先依據觸發排程的 Cron 表達式判斷是否為週六排程，避免 GitHub Actions 隊列延遲跨日誤判
          CRON_SCHEDULE="${{ github.event.schedule }}"
          DAY_OF_WEEK=$(date +%u)
          if [[ "$CRON_SCHEDULE" == *"6"* ]] || ([ -z "$CRON_SCHEDULE" ] && [ "$DAY_OF_WEEK" -eq 6 ]); then
            echo "REOPTIMIZE_FLAG=--force" >> $GITHUB_ENV
            echo "Schedule or Day is Saturday, enabling force re-optimization."
          else
            echo "REOPTIMIZE_FLAG=" >> $GITHUB_ENV
            echo "Regular weekday run."
          fi

      - name: Run SuperTrend AI Batch Optimization & Send Telegram Notification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          python run_batch_optimization_supertrend_ai.py $REOPTIMIZE_FLAG --telegram

      - name: Setup Pages
        if: hashFiles('public/index.html') != ''
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: hashFiles('public/index.html') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public/'

      - name: Deploy to GitHub Pages
        if: hashFiles('public/index.html') != ''
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Commit and Push Updated Parameters & Signals
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 檢查 JSON 檔案是否被建立或修改
          git add data/optimized_params_ai.json data/latest_signals_ai.json 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "auto: update optimized_params_ai.json & latest_signals_ai.json [skip ci]"
            # 併發防禦機制：拉取最新遠端 commit 並進行 rebase 重試，避免與其他工作流推送衝突
            pushed=0
            for i in {1..5}; do
              echo "Push attempt $i: Pulling latest changes with rebase..."
              if git pull --rebase --autostash origin "${{ github.ref_name }}" && git push; then
                pushed=1
                echo "Successfully pushed changes to remote!"
                break
              fi
              echo "Push attempt $i failed. Cleaning up rebase state and retrying in 5s..."
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "Failed to push after multiple attempts."
              exit 1
            fi
          else
            echo "No changes to commit."
          fi
